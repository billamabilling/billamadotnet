name: Deploy Static Next.js Site to GitHub Pages

# Actions are pinned to full commit SHAs resolved on 2026-10-12 from the
# tags this file used to float. A moved tag runs inside the job that
# publishes https://billama.net. The build job executes pnpm install and
# must not hold Pages deploy credentials. Only the deploy job, and only
# for a non-PR push of main, may publish the site.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Production deploys share one queue. Every other ref gets its own group
  # so a pull-request run cannot block a fix to the live site.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages' || github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.12.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and run integrity tests
        run: |
          pnpm run typecheck
          pnpm run test

      - name: Build static site with Next.js export
        run: pnpm run build

      - name: Verify Pages artifact integrity (CNAME & .nojekyll)
        run: |
          cp public/CNAME ./out/CNAME
          touch ./out/.nojekyll
          echo "Verified domain: $(cat ./out/CNAME)"

      - name: Run post-build static export & link validation
        run: pnpm run test:export

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
